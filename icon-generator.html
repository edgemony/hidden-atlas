<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator - Hidden Atlas</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #f0f0f0;
            font-family: 'Courier New', monospace;
        }

        .instructions {
            max-width: 600px;
            margin: 0 auto 30px;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }

        .icons {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .icon-container {
            text-align: center;
        }

        .icon {
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .icon-192 {
            width: 192px;
            height: 192px;
        }

        .icon-512 {
            width: 512px;
            height: 512px;
        }

        .icon-180 {
            width: 180px;
            height: 180px;
        }

        .icon-text {
            color: #4a90a4;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: -0.05em;
        }

        .icon-180 .icon-text {
            font-size: 85px;
        }

        .icon-192 .icon-text {
            font-size: 90px;
        }

        .icon-512 .icon-text {
            font-size: 240px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #4a90a4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #3a7084;
        }

        .step {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h2>Icon Generator for Hidden Atlas</h2>
        <p><strong>Instructions:</strong></p>
        <div class="step">1. Click the "Download" button below each icon</div>
        <div class="step">2. Save as <code>icon-180.png</code>, <code>icon-192.png</code>, and <code>icon-512.png</code></div>
        <div class="step">3. Move all files to your <code>public/</code> folder</div>
        <p style="margin-top: 20px; color: #666; font-size: 14px;">
            <strong>Note:</strong> The 180×180 icon is specifically for iOS/Safari PWA support.
        </p>
    </div>

    <div class="icons">
        <div class="icon-container">
            <div class="icon icon-180" id="icon180">
                <div class="icon-text">HA</div>
            </div>
            <label>icon-180.png (180×180) - iOS</label>
            <button onclick="downloadIcon('icon180', 180, 'icon-180.png')">Download 180×180</button>
        </div>

        <div class="icon-container">
            <div class="icon icon-192" id="icon192">
                <div class="icon-text">HA</div>
            </div>
            <label>icon-192.png (192×192)</label>
            <button onclick="downloadIcon('icon192', 192, 'icon-192.png')">Download 192×192</button>
        </div>

        <div class="icon-container">
            <div class="icon icon-512" id="icon512">
                <div class="icon-text">HA</div>
            </div>
            <label>icon-512.png (512×512)</label>
            <button onclick="downloadIcon('icon512', 512, 'icon-512.png')">Download 512×512</button>
        </div>
    </div>

    <script>
        async function downloadIcon(elementId, size, filename) {
            const element = document.getElementById(elementId);

            // Create a canvas
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Draw background with rounded corners
            const radius = size * 0.2;
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();

            // Draw text
            ctx.fillStyle = '#4a90a4';
            ctx.font = `bold ${size * 0.47}px 'Courier New', monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('HA', size / 2, size / 2);

            // Download
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
